name: Tests and Linting

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # pyproject.toml is the source of truth; uv.lock and the pip files are generated
      - name: Check dependency files are in sync
        run: |
          python -m pip install uv
          uv lock --check
          uv export --no-dev --no-emit-project --format requirements-txt | diff -u requirements.txt - \
            || { echo "requirements.txt is stale: re-export it from uv.lock (see pyproject.toml)"; exit 1; }
          uv export --no-emit-project --format requirements-txt | diff -u requirements-dev.txt - \
            || { echo "requirements-dev.txt is stale: re-export it from uv.lock (see pyproject.toml)"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          GOOGLE_API_KEY: test-key
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # tsconfig.json is a solution file ("files": [] + references), so a plain
      # `tsc --noEmit` checks nothing — build mode follows the references.
      - name: Run TypeScript compiler check
        run: npx tsc -b

      - name: Run Vitest
        run: npm test

  build-test:
    name: Production Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "dist directory not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "index.html not found in dist!"
            exit 1
          fi
          echo "Build successful!"
