# Single source of truth for Python dependencies. uv.lock pins the full tree;
# requirements.txt / requirements-dev.txt (used by Docker and CI via pip) are
# generated from it — never edit them by hand. After changing anything here:
#
#   uv lock
#   uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
#   uv export --no-emit-project --format requirements-txt > requirements-dev.txt
#
# CI fails if the lock or the exported files are out of date.
#
# Landmark extraction (mediapipe, opencv-python, yt-dlp, beautifulsoup4) is not
# managed here: it needs its own Python 3.11 venv — see CLAUDE.md "Adding New Signs".

[project]
name = "asl-app"
version = "0.1.0"
description = "ASL Dictionary: FastAPI backend and Gemini translation pipeline"
readme = "README.md"
# Production image and CI run Python 3.11
requires-python = ">=3.11"
dependencies = [
    # Direct Gemini API (replaced LangChain/LangGraph to cut ~120MB baseline RAM)
    "google-genai>=1.57.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.2.1",
    # FastAPI and server
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.21",
    "slowapi>=0.1.9",
    "loguru>=0.7.3",
    # Database (async SQLite by default; asyncpg for DATABASE_URL=postgresql+asyncpg://...)
    "sqlalchemy[asyncio]>=2.0.45",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    # Optional cache backend (used when REDIS_URL is set)
    "redis>=7.1.0",
]

[project.optional-dependencies]
# ENABLE_SEMANTIC_LOOKUP=true — needs ~200MB extra RAM, so not in the default image
semantic = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "ruff>=0.15.7",
]
# Model training/conversion scripts (alphabet_translate/, python_code/convert_*.py):
#   uv sync --group training
training = [
    "torch>=2.10.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.8.0",
    "pandas>=2.2.0",
    "tqdm>=4.67.3",
]
